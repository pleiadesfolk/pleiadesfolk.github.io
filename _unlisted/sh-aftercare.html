/* ── Navigation ───────────────────────────────────────────────── */
var history = [];
var current = "Welcome";

function mountKitCarousel() {
  var mount = document.getElementById('kit-carousel-mount');
  if (!mount) return;

  var idx = 0;
  var total = KIT_ITEMS.length;

  function html() {
    return '<div class="kit-carousel">' +
      '<div class="kit-track-wrap"><div class="kit-track" id="kit-track">' +
        KIT_ITEMS.map(function(item) {
          return '<div class="kit-slide">' +
                 (item.image ? '<img class="kit-slide-img" src="' + item.image + '" alt="' + item.title + '">' : '') +
                 '<div class="kit-slide-title">' + item.title + '</div>' +
                 '<div class="kit-slide-body">' + item.body + '</div></div>';
        }).join('') +
      '</div></div>' +
      '<div class="kit-controls">' +
        '<button class="kit-arrow" id="kit-prev">← Prev</button>' +
        '<div class="kit-dots" id="kit-dots"></div>' +
        '<span class="kit-counter" id="kit-counter"></span>' +
        '<button class="kit-arrow" id="kit-next">Next →</button>' +
      '</div></div>';
  }

  mount.innerHTML = html();

  function update() {
    var track = document.getElementById('kit-track');
    if (track) track.style.transform = 'translateX(-' + (idx * 100) + '%)';

    var counter = document.getElementById('kit-counter');
    if (counter) counter.textContent = (idx + 1) + ' / ' + total;

    var prev = document.getElementById('kit-prev');
    var next = document.getElementById('kit-next');
    if (prev) prev.disabled = idx === 0;
    if (next) next.disabled = idx === total - 1;

    var dots = document.getElementById('kit-dots');
    if (dots) {
      var dotBtns = dots.querySelectorAll('.kit-dot');
      dotBtns.forEach(function(d, i) {
        d.classList.toggle('active', i === idx);
      });
    }
  }

  var dotsEl = document.getElementById('kit-dots');
  if (dotsEl) {
    KIT_ITEMS.forEach(function(_, i) {
      var dot = document.createElement('button');
      dot.className = 'kit-dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', 'Go to item ' + (i + 1));
      dot.addEventListener('click', function() { idx = i; update(); });
      dotsEl.appendChild(dot);
    });
  }

  var prevBtn = document.getElementById('kit-prev');
  var nextBtn = document.getElementById('kit-next');
  if (prevBtn) prevBtn.addEventListener('click', function() { if (idx > 0) { idx--; update(); } });
  if (nextBtn) nextBtn.addEventListener('click', function() { if (idx < total - 1) { idx++; update(); } });

  update();
}

function render() {
  var passage = PASSAGES[current];
  if (!passage) return;

  document.getElementById('sha-header').textContent = passage.header;
  document.getElementById('sha-text').innerHTML = passage.text;

  var choicesEl = document.getElementById('sha-choices');
  choicesEl.innerHTML = '';

  var items = passage.choices.length > 0
    ? passage.choices
    : [{ label: "Start over from the beginning.", target: null }];

  items.forEach(function(choice) {
    var btn = document.createElement('button');
    btn.className = 'sha-btn';
    btn.textContent = choice.label;
    btn.addEventListener('click', function() {
      if (choice.target === null) {
        history = [];
        current = "Welcome";
      } else {
        history.push(current);
        current = choice.target;
      }
      render();
    });
    choicesEl.appendChild(btn);
  });

  document.getElementById('sha-back').disabled = history.length === 0;

  if (current === 'Kit') mountKitCarousel();
}

document.getElementById('sha-back').addEventListener('click', function() {
  if (history.length > 0) {
    current = history.pop();
    render();
  }
});

document.getElementById('sha-restart').addEventListener('click', function() {
  history = [];
  current = "Welcome";
  render();
});

render();

/* ── Embed mode ───────────────────────────────────────────────── */
var _params = new URLSearchParams(window.location.search);
if (_params.has('embed')) {
  var _book = document.querySelector('.book');
  if (_book) {
    _book.classList.add('is-embed');
    var _theme = _params.get('theme');
    if (_theme === 'dark')  { _book.classList.add('color-theme-2'); _book.classList.remove('color-theme-1'); }
    if (_theme === 'light') { _book.classList.add('color-theme-1'); _book.classList.remove('color-theme-2'); }
    new MutationObserver(function() {
      if (_book.classList.contains('with-summary')) {
        _book.classList.remove('with-summary');
        _book.classList.remove('without-animation');
      }
    }).observe(_book, { attributes: true, attributeFilter: ['class'] });
    document.getElementById('embedThemeBtn').addEventListener('click', function() {
      var isDark = _book.classList.contains('color-theme-2');
      if (isDark) { _book.classList.remove('color-theme-2'); _book.classList.add('color-theme-1'); }
      else        { _book.classList.add('color-theme-2');    _book.classList.remove('color-theme-1'); }
    });
  }
}

})();
</script>
